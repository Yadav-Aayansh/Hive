services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    env_file:
      - ./server/.env
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
